<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Puff Log" />
  <title>Puff Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #ff8c28;
      --bg: #0d0d0d;
      --card: #111;
      --border: #2a2a2a;
      --text: #e8dcc8;
      --muted: #555;
      --dim: #333;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(env(safe-area-inset-top), 36px) 20px max(env(safe-area-inset-bottom), 32px);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,140,40,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .grain {
      position: fixed;
      inset: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(42px, 13vw, 64px);
      letter-spacing: 6px;
      color: var(--orange);
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* Stats */
    .stats-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 30px;
    }

    .stat-card {
      flex: 1;
      border: 1px solid var(--border);
      padding: 12px 10px;
      background: var(--card);
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      opacity: 0.4;
    }

    .stat-label {
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: clamp(20px, 6vw, 28px);
      font-weight: 600;
      color: var(--orange);
      line-height: 1;
    }

    .stat-value.sm { font-size: clamp(13px, 4vw, 18px); }

    /* Button */
    .btn-wrap {
      position: relative;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,140,40,0.2);
      animation: pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    .r1 { width: 178px; height: 178px; }
    .r2 { width: 200px; height: 200px; animation-delay: 1.5s; border-color: rgba(255,140,40,0.1); }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.03); opacity: 0.2; }
    }

    #puffBtn {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      border: 2px solid var(--orange);
      background: radial-gradient(circle at 40% 35%, #2a1500, #0d0d0d);
      color: var(--orange);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 4px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255,140,40,0.15), inset 0 0 40px rgba(255,140,40,0.05);
      transition: transform 0.1s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #puffBtn:active {
      transform: scale(0.93);
      box-shadow: 0 0 60px rgba(255,140,40,0.5), inset 0 0 30px rgba(255,140,40,0.15);
    }

    #puffBtn.flash {
      box-shadow: 0 0 80px rgba(255,140,40,0.7), inset 0 0 40px rgba(255,140,40,0.2);
      border-color: #ffb060;
    }

    #flashOverlay {
      position: fixed;
      inset: 0;
      background: rgba(255,140,40,0.05);
      pointer-events: none;
      opacity: 0;
      z-index: 10;
      transition: opacity 0.05s;
    }
    #flashOverlay.show { opacity: 1; }

    /* Chart */
    .section { width: 100%; margin-bottom: 24px; }

    .section-title {
      font-size: 8px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 68px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      height: 100%;
    }

    .bar-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
    }

    .bar {
      width: 100%;
      background: #2a1a08;
      transition: height 0.5s cubic-bezier(.34,1.3,.64,1);
    }

    .bar.has-puffs { background: var(--orange); opacity: 0.55; }
    .bar.current   { background: var(--orange); opacity: 1; box-shadow: 0 0 6px rgba(255,140,40,0.5); }

    .bar-count { font-size: 8px; color: var(--muted); min-height: 10px; line-height: 1; }
    .bar-hour  { font-size: 7px; color: var(--dim); }

    /* Log */
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .log-actions { display: flex; gap: 8px; }

    .action-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--dim);
      background: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      cursor: pointer;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    #exportBtn:active { color: #4caf88; border-color: #4caf88; }
    #clearBtn:active  { color: #ff4444; border-color: #ff4444; }

    .log-entries { max-height: 200px; overflow-y: auto; }

    .log-entry {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 10px;
      color: #3a3a3a;
    }

    .log-entry:first-child { color: #aa7040; }
    .log-entry .num { color: #252525; }

    .empty-log {
      text-align: center;
      padding: 24px 0;
      color: #222;
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: max(env(safe-area-inset-bottom), 24px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1a1a;
      border: 1px solid var(--border);
      color: #4caf88;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 20px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div id="flashOverlay"></div>
  <div id="toast">CSV exported</div>

  <div class="content">
    <h1>Puff Log</h1>
    <p class="subtitle">Track · Reflect · Reduce</p>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Today</div>
        <div class="stat-value" id="statToday">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Puff</div>
        <div class="stat-value sm" id="statLast">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">All Time</div>
        <div class="stat-value" id="statAll">0</div>
      </div>
    </div>

    <div class="btn-wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <button id="puffBtn">LOG PUFF</button>
    </div>

    <div class="section">
      <div class="section-title">Puffs per hour — today</div>
      <div class="chart" id="chart"></div>
    </div>

    <div class="section">
      <div class="log-header">
        <div class="section-title" style="margin-bottom:0">Recent log</div>
        <div class="log-actions">
          <button class="action-btn" id="exportBtn">Export CSV</button>
          <button class="action-btn" id="clearBtn">Clear all</button>
        </div>
      </div>
      <div class="log-entries" id="logEntries"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'puff-timestamps-v1';
    let timestamps = [];

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) timestamps = JSON.parse(raw);
      } catch (_) {}
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(timestamps)); } catch (_) {}
    }

    function isToday(ts) {
      const d = new Date(ts), n = new Date();
      return d.getFullYear() === n.getFullYear() &&
             d.getMonth()    === n.getMonth()    &&
             d.getDate()     === n.getDate();
    }

    function formatElapsed(ms) {
      const s = Math.floor(ms / 1000);
      if (s < 60)  return s + 's';
      const m = Math.floor(s / 60);
      if (m < 60)  return m + 'm ' + (s % 60) + 's';
      const h = Math.floor(m / 60);
      return h + 'h ' + (m % 60) + 'm';
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return String(d.getHours()).padStart(2,'0') + ':' +
             String(d.getMinutes()).padStart(2,'0') + ':' +
             String(d.getSeconds()).padStart(2,'0');
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return d.getFullYear() + '-' +
             String(d.getMonth()+1).padStart(2,'0') + '-' +
             String(d.getDate()).padStart(2,'0');
    }

    function render() {
      const now = Date.now();
      const todayTs = timestamps.filter(isToday);
      const last = timestamps.length > 0
        ? new Date(timestamps[timestamps.length - 1]).getTime()
        : null;

      document.getElementById('statToday').textContent = todayTs.length;
      document.getElementById('statAll').textContent   = timestamps.length;

      const lastEl = document.getElementById('statLast');
      if (last) {
        const el = formatElapsed(now - last);
        lastEl.textContent = el;
        lastEl.className = 'stat-value' + (el.length > 5 ? ' sm' : '');
      } else {
        lastEl.textContent = '—';
        lastEl.className = 'stat-value';
      }

      // Chart
      const currentHour = new Date().getHours();
      const startHour = 6;
      const endHour = Math.max(currentHour, startHour + 11);
      const buckets = Array.from({ length: 24 }, (_, h) => ({ hour: h, count: 0 }));
      todayTs.forEach(ts => { buckets[new Date(ts).getHours()].count++; });
      const visible = buckets.slice(startHour, endHour + 1);
      const maxCount = Math.max(...visible.map(b => b.count), 1);

      const chart = document.getElementById('chart');
      chart.innerHTML = '';
      visible.forEach(b => {
        const barH = b.count === 0 ? 2 : Math.max(4, (b.count / maxCount) * 56);
        const isCur = b.hour === currentHour;
        const col = document.createElement('div');
        col.className = 'bar-col';
        col.innerHTML =
          '<div class="bar-wrap">' +
            '<div class="bar ' + (isCur ? 'current' : b.count > 0 ? 'has-puffs' : '') + '" style="height:' + barH + 'px"></div>' +
          '</div>' +
          '<div class="bar-count">' + (b.count > 0 ? b.count : '') + '</div>' +
          '<div class="bar-hour">' + b.hour + '</div>';
        chart.appendChild(col);
      });

      // Log
      const logEl = document.getElementById('logEntries');
      if (timestamps.length === 0) {
        logEl.innerHTML = '<div class="empty-log">no entries yet</div>';
        return;
      }
      logEl.innerHTML = [...timestamps].reverse().slice(0, 60).map((ts, i) => {
        const idx = timestamps.length - i;
        return '<div class="log-entry">' +
          '<span class="num">#' + idx + '</span>' +
          '<span>' + formatDate(ts) + '</span>' +
          '<span>' + formatTime(ts) + '</span>' +
          '</div>';
      }).join('');
    }

    function logPuff() {
      timestamps.push(new Date().toISOString());
      save();
      render();

      const btn = document.getElementById('puffBtn');
      const overlay = document.getElementById('flashOverlay');
      btn.classList.add('flash');
      overlay.classList.add('show');
      setTimeout(() => {
        btn.classList.remove('flash');
        overlay.classList.remove('show');
      }, 300);
    }

    function exportCSV() {
      if (timestamps.length === 0) { showToast('No data to export'); return; }

      const rows = ['#,iso_timestamp,date,time'];
      timestamps.forEach((ts, i) => {
        rows.push((i + 1) + ',' + ts + ',' + formatDate(ts) + ',' + formatTime(ts));
      });

      const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'puff-log-' + formatDate(new Date().toISOString()) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('CSV downloaded');
    }

    function clearAll() {
      if (!confirm('Clear ALL puff history? This cannot be undone.')) return;
      timestamps = [];
      save();
      render();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    setInterval(render, 1000);

    document.getElementById('puffBtn').addEventListener('click', logPuff);
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
    document.getElementById('clearBtn').addEventListener('click', clearAll);

    load();
    render();
  </script>
</body>
</html>
